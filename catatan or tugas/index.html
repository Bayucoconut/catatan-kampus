<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Catatan Tugas Kampus</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Manifest & Setup PWA HP -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

  <div class="main-wrapper">
    <!-- Header Minimalis dengan Color Picker -->
    <header class="app-header">
      <div class="header-info">
        <h2>📚 Catatan Kampus</h2>
        <p class="subtitle">Kelola tugas & deadline kuliahmu</p>
      </div>
      <div class="header-controls">
        <div class="color-picker-wrapper" title="Ubah Warna Background">
          <label for="bgPicker">🎨</label>
          <input type="color" id="bgPicker" value="#0d1117">
        </div>
        <div class="clock-badge" id="clock">00:00:00 WIB</div>
      </div>
    </header>

    <!-- Form Input Tugas -->
    <section class="card form-card">
      <div class="form-group">
        <input type="text" id="matkul" placeholder="Mata Kuliah (misal: Jaringan Komputer)">
        <textarea id="deskripsi" placeholder="Rincian Tugas / Catatan..."></textarea>
        <div class="form-row">
          <input type="date" id="deadline">
          <button id="btnTambah">Tambah Tugas</button>
        </div>
      </div>
    </section>

    <!-- Section Daftar Catatan -->
    <section class="card list-card">
      <div class="list-header">
        <h3>Daftar Catatan</h3>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Cari catatan...">
        </div>
      </div>

      <div class="filter-row">
        <div class="filter-buttons">
          <button class="btn-filter active" data-filter="all">Semua</button>
          <button class="btn-filter" data-filter="pending">Belum</button>
          <button class="btn-filter" data-filter="completed">Selesai</button>
        </div>
        <button id="btnHapusSelesai" class="btn-text-danger">Hapus Selesai</button>
      </div>

      <div id="taskList" class="task-container">
        <!-- Item tugas akan render di sini -->
      </div>

      <div class="list-footer">
        <span id="counterText">0 tugas tersisa</span>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
  
  <!-- Register PWA Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
